# Runs `npm test` on pull requests.
#
# This repo had tests but nothing running them, so a change that broke the
# delta encoder's contract with the tracker's decoder — or the presence routes'
# contract with the tracker's client — would have merged green. Both suites are
# plain Node with no browser and no network, so this is cheap.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # better-sqlite3 builds native, and nothing under test needs it, so the
      # install skips optional/native rebuilds where it can.
      - name: Install dependencies
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - run: npm test
