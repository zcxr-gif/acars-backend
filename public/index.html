<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Flight Tracker Dashboard</title>
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* --- New Modal Styles --- */
        #modal-details-content {
            max-height: 70vh;
            overflow-y: auto;
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #eee;
        }
        .modal-section {
            margin-bottom: 20px;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
        }
        .modal-section:last-child {
            border-bottom: none;
        }
        .modal-section h3 {
            color: #00aaff;
            margin-top: 0;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }
        .state-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 10px;
        }
        .state-grid p {
            margin: 0;
            padding: 8px;
            background-color: #2a2a2a;
            border-radius: 4px;
            font-size: 0.9em;
        }
        .state-grid p strong {
            color: #ccc;
            display: block;
            margin-bottom: 4px;
            font-size: 0.8em;
            text-transform: uppercase;
        }
        
        /* Status colors (borrowed from tracker card) */
        .state-grid .status-tracking { color: #4CAF50; }
        .state-grid .status-searching { color: #FFC107; }
        .state-grid .status-landed { color: #2196F3; }
        .state-grid .status-stopped, .state-grid .status-not_found, .state-grid .status-timeout { color: #f44336; }

        .modal-log-list {
            list-style-type: none;
            padding-left: 0;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9em;
            max-height: 300px;
            overflow-y: auto;
            background-color: #1a1a1a;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #333;
        }
        .modal-log-list li {
            padding: 4px 0;
            border-bottom: 1px dashed #333;
        }
        .modal-log-list li:last-child {
            border-bottom: none;
        }
        .modal-log-list .log-time {
            color: #888;
            margin-right: 10px;
            font-size: 0.9em;
        }
        .modal-log-list .log-detail {
            color: #aaa;
            font-style: italic;
        }
        
        /* Log event type colors */
        .modal-log-list .log-created { color: #ccc; }
        .modal-log-list .log-online { color: #4CAF50; }
        .modal-log-list .log-new_flight { color: #4CAF50; font-weight: bold;}
        .modal-log-list .log-takeoff { color: #00aaff; font-weight: bold; }
        .modal-log-list .log-landed { color: #2196F3; font-weight: bold; }
        .modal-log-list .log-offline { color: #FFC107; }
        .modal-log-list .log-searching { color: #aaa; }
        .modal-log-list .log-stopped { color: #f44336; }
        .modal-log-list .log-timeout { color: #f44336; font-weight: bold; }
        .modal-log-list .log-analysis_start { color: #03a9f4; }
        .modal-log-list .log-analysis_fail { color: #ff9800; }
        .modal-log-list .log-analysis_nodata { color: #ff9800; }
        .modal-log-list .log-analysis_error { color: #f44336; }
        .modal-log-list .log-background { color: #9c27b0; }
        .modal-log-list .log-active { color: #e91e63; }
        .modal-log-list .log-delayed { color: #ffeb3b; }
    </style>
</head>
<body>
    <header>
        <h1>Live Flight Tracker Dashboard</h1>
    </header>

    <main>
        <section class="control-panel">
            <h2>Start New Tracker</h2>
            <form id="start-tracker-form">
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" placeholder="e.g., Laura" required>
                </div>
                <div class="form-group">
                    <label for="server">Server:</label>
                    <input type="text" id="server" name="server" value="Expert Server" required>
                </div>
                <button type="submit">Start Tracking</button>
            </form>
            <p id="error-message" class="error-text"></p>
        </section>

        <section class="live-log">
            <h2>Live Log</h2>
            <div id="live-log-container">
                <ul id="live-log-list">
                    </ul>
            </div>
        </section>

        <section class="tracker-list">
            <h2>Active Trackers</h2>
            <div id="trackers-container">
                <p>Loading trackers...</p>
            </div>
        </section>
    </main>

    <div id="details-modal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h2>Tracker Details</h2>
            <div id="modal-details-content">
                </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
